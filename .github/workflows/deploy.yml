name: CI/CD Pipeline & Auto-Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. TEST: Automated unit tests with local MongoDB service
  # =========================================================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with dependencies
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        env:
          PORT: 3000
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/ai-readiness-test
          GEMINI_API_KEY: ci-test-dummy-gemini-key
          PAGESPEED_API_KEY: ci-test-dummy-pagespeed-key
          ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          MAX_PAGES: 15
        run: npm test

  # =========================================================================
  # 2. BUILD & PUSH: Build Docker image and push to Docker Hub
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-architecture AMD64 + ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fospertise-audit:latest

  # =========================================================================
  # 3. DEPLOY: SSH into Oracle Linux 9 VPS and pull & restart container
  # =========================================================================
  deploy:
    name: Deploy to VPS (Oracle Linux 9)
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'opc' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting Automated Deployment on Oracle Linux 9 VPS..."
            
            APP_DIR="${{ secrets.VPS_APP_DIR || '/home/opc/fospertise-seo-audit-tool' }}"
            eval APP_DIR=$APP_DIR
            cd "$APP_DIR" || { echo "Directory $APP_DIR not found!"; exit 1; }

            echo "📥 Pulling latest Docker image from Docker Hub..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fospertise-audit:latest

            echo "🔄 Updating running container..."
            export DOCKER_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/fospertise-audit:latest"
            docker compose up -d

            echo "🧹 Removing old unused images..."
            docker image prune -f

            echo "✅ Deployment completed successfully! Container status:"
            docker ps --filter "name=fospertise-audit"
